<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>股市新聞 Dashboard</title>
    <!-- 明確指定 Chart.js 版本 v4.4.1 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .refresh-time {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
        }

        .stat-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-size: 2.5em;
            font-weight: bold;
            color: #667eea;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            /* 確保有高度讓 chart 顯示 */
            min-height: 300px;
            display: flex;
            flex-direction: column;
        }

        .chart-container {
            flex: 1;
            position: relative;
            min-height: 250px;
        }

        .chart-title {
            font-size: 1.3em;
            margin-bottom: 20px;
            color: #333;
        }

        .news-section {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .news-item {
            padding: 15px;
            border-bottom: 1px solid #eee;
            transition: background 0.2s;
        }

        .news-item:hover {
            background: #f8f9fa;
        }

        .news-item:last-child {
            border-bottom: none;
        }

        .news-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .stock-badge {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .sentiment-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .sentiment-positive {
            background: #10b981;
            color: white;
        }

        .sentiment-neutral {
            background: #f59e0b;
            color: white;
        }

        .sentiment-negative {
            background: #ef4444;
            color: white;
        }

        .news-title {
            font-size: 1.1em;
            color: #333;
            margin-bottom: 5px;
        }

        .news-title a {
            color: #333;
            text-decoration: none;
            transition: color 0.2s;
        }

        .news-title a:hover {
            color: #667eea;
            text-decoration: underline;
        }

        .news-meta {
            font-size: 0.85em;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 1.2em;
        }

        @media (max-width: 768px) {
            .charts-grid {
                grid-template-columns: 1fr;
            }
        }

        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 15px;
        }

        .indicator-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
        }

        .indicator-icon {
            font-size: 1.6em;
            margin-bottom: 6px;
        }

        .indicator-label {
            color: #666;
            font-size: 0.9em;
            margin-bottom: 10px;
        }

        .indicator-score {
            font-size: 2.4em;
            font-weight: bold;
            color: #333;
        }

        .indicator-score .max {
            font-size: 0.4em;
            color: #999;
            font-weight: normal;
        }

        .meter-track {
            background: #e9ecef;
            border-radius: 6px;
            height: 10px;
            overflow: hidden;
            margin: 10px 0 8px;
        }

        .meter-fill {
            height: 100%;
            border-radius: 6px;
            width: 0%;
            transition: width 0.4s ease;
        }

        .indicator-status {
            font-size: 0.9em;
            font-weight: bold;
            color: #999;
        }

        .status-good { color: #10b981; }
        .status-neutral { color: #f59e0b; }
        .status-bad { color: #ef4444; }

        .fill-good { background: linear-gradient(90deg, #34d399, #10b981); }
        .fill-neutral { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
        .fill-bad { background: linear-gradient(90deg, #f87171, #ef4444); }

        .topic-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 15px;
        }

        .topic-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 18px;
            border-left: 4px solid #667eea;
        }

        .topic-rank {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            text-align: center;
            line-height: 22px;
            font-size: 0.8em;
            font-weight: bold;
            margin-right: 8px;
        }

        .topic-keyword {
            font-size: 1.15em;
            font-weight: bold;
            color: #333;
        }

        .topic-category {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.78em;
            background: #e0e7ff;
            color: #4338ca;
        }

        .topic-meta {
            margin-top: 10px;
            font-size: 0.85em;
            color: #666;
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>📊 股市新聞即時 Dashboard</h1>
            <div class="refresh-time">最後更新: <span id="lastUpdate">載入中...</span></div>
        </header>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">總新聞數</div>
                <div class="stat-value" id="totalNews">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">追蹤股票數</div>
                <div class="stat-value" id="totalStocks">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">今日新增</div>
                <div class="stat-value" id="todayNews">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">平均情緒</div>
                <div class="stat-value" id="avgSentiment">-</div>
            </div>
        </div>

        <div class="news-section" style="margin-bottom: 30px;">
            <h3 class="chart-title">📊 三大分數指標</h3>
            <div class="indicator-grid">
                <div class="indicator-card" id="indicator-market_sentiment">
                    <div class="indicator-icon">💭</div>
                    <div class="indicator-label">市場情緒分數</div>
                    <div class="indicator-score">- <span class="max">/ 10</span></div>
                    <div class="meter-track"><div class="meter-fill"></div></div>
                    <div class="indicator-status">載入中...</div>
                </div>
                <div class="indicator-card" id="indicator-topic_heat">
                    <div class="indicator-icon">🔥</div>
                    <div class="indicator-label">題材熱度分數</div>
                    <div class="indicator-score">- <span class="max">/ 10</span></div>
                    <div class="meter-track"><div class="meter-fill"></div></div>
                    <div class="indicator-status">載入中...</div>
                </div>
                <div class="indicator-card" id="indicator-news_momentum">
                    <div class="indicator-icon">⚡</div>
                    <div class="indicator-label">新聞動能分數</div>
                    <div class="indicator-score">- <span class="max">/ 10</span></div>
                    <div class="meter-track"><div class="meter-fill"></div></div>
                    <div class="indicator-status">載入中...</div>
                </div>
            </div>
        </div>

        <div class="news-section" style="margin-bottom: 30px;">
            <h3 class="chart-title">🔥 熱門議題 Top 3</h3>
            <div class="topic-grid" id="topicGrid">
                <div class="loading">載入中...</div>
            </div>
        </div>

        <div class="news-section" style="margin-bottom: 30px;">
            <h3 class="chart-title">📅 本周新聞分析 (最近7天)</h3>
            <div class="stats-grid" style="margin-top: 20px;">
                <div class="stat-card"
                    style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white;">
                    <div class="stat-label" style="color: rgba(255,255,255,0.9);">本周總新聞</div>
                    <div class="stat-value" style="color: white;" id="weeklyTotalNews">-</div>
                </div>
                <div class="stat-card"
                    style="background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white;">
                    <div class="stat-label" style="color: rgba(255,255,255,0.9);">平均情緒</div>
                    <div class="stat-value" style="color: white;" id="weeklyAvgSentiment">-</div>
                </div>
                <div class="stat-card"
                    style="background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); color: white;">
                    <div class="stat-label" style="color: rgba(255,255,255,0.9);">正面新聞</div>
                    <div class="stat-value" style="color: white;" id="weeklyPositive">-</div>
                </div>
                <div class="stat-card"
                    style="background: linear-gradient(135deg, #fa709a 0%, #fee140 100%); color: white;">
                    <div class="stat-label" style="color: rgba(255,255,255,0.9);">負面新聞</div>
                    <div class="stat-value" style="color: white;" id="weeklyNegative">-</div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <h4 style="color: #666; font-size: 1.1em; margin-bottom: 15px;">🔥 本周最熱門股票 TOP 5</h4>
                <div id="weeklyTopStocks" style="color: #666;">載入中...</div>
            </div>
        </div>

        <div class="chart-card" style="margin-bottom: 30px;">
            <h3 class="chart-title">📈 一周情緒趨勢</h3>
            <div class="chart-container">
                <canvas id="weeklySentimentChart"></canvas>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-card">
                <h3 class="chart-title">情緒分數分布</h3>
                <div class="chart-container">
                    <canvas id="sentimentChart"></canvas>
                </div>
            </div>
            <div class="chart-card">
                <h3 class="chart-title">最活躍股票 TOP 10</h3>
                <div class="chart-container">
                    <canvas id="topStocksChart"></canvas>
                </div>
            </div>
        </div>

        <div class="chart-card" style="margin-bottom: 30px;">
            <h3 class="chart-title">30天新聞趨勢</h3>
            <div class="chart-container">
                <canvas id="dailyTrendChart"></canvas>
            </div>
        </div>

        <div class="news-section">
            <h3 class="chart-title">最新新聞</h3>
            <div id="newsList" class="loading">載入中...</div>
        </div>
    </div>

    <script>
        let sentimentChart, topStocksChart, dailyTrendChart, weeklySentimentChart;

        function updateTime() {
            const now = new Date();
            document.getElementById('lastUpdate').textContent = now.toLocaleString('zh-TW');
        }

        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                document.getElementById('totalNews').textContent = data.total_news.toLocaleString();
                document.getElementById('totalStocks').textContent = data.total_stocks.toLocaleString();
                document.getElementById('todayNews').textContent = data.today_news.toLocaleString();
                document.getElementById('avgSentiment').textContent = data.avg_sentiment || 'N/A';
            } catch (e) {
                console.error("fetchStats error", e);
            }
        }

        async function fetchSentimentDistribution() {
            try {
                const response = await fetch('/api/sentiment_distribution');
                const data = await response.json();

                const ctx = document.getElementById('sentimentChart').getContext('2d');

                if (sentimentChart) sentimentChart.destroy();

                sentimentChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: '新聞數量',
                            data: data.data,
                            backgroundColor: 'rgba(102, 126, 234, 0.6)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("fetchSentimentDistribution error", e);
            }
        }

        async function fetchTopStocks() {
            try {
                const response = await fetch('/api/top_stocks');
                const data = await response.json();

                const ctx = document.getElementById('topStocksChart').getContext('2d');

                if (topStocksChart) topStocksChart.destroy();

                // Chart.js v4 橫向直方圖設定
                topStocksChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: '新聞數量',
                            data: data.data,
                            backgroundColor: 'rgba(118, 75, 162, 0.6)',
                            borderColor: 'rgba(118, 75, 162, 1)',
                            borderWidth: 2
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        indexAxis: 'y', // 這行是關鍵: 將 X 軸設為索引軸 (即橫向)
                        scales: {
                            x: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("fetchTopStocks error", e);
            }
        }

        async function fetchDailyTrend() {
            try {
                const response = await fetch('/api/daily_trend');
                const data = await response.json();

                const ctx = document.getElementById('dailyTrendChart').getContext('2d');

                if (dailyTrendChart) dailyTrendChart.destroy();

                dailyTrendChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: '新聞數量',
                            data: data.data,
                            backgroundColor: 'rgba(102, 126, 234, 0.2)',
                            borderColor: 'rgba(102, 126, 234, 1)',
                            borderWidth: 2,
                            fill: true,
                            tension: 0.4
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("fetchDailyTrend error", e);
            }
        }

        async function fetchWeeklyAnalysis() {
            try {
                const response = await fetch('/api/weekly_analysis');
                const data = await response.json();

                document.getElementById('weeklyTotalNews').textContent = data.total_news.toLocaleString();
                document.getElementById('weeklyAvgSentiment').textContent = data.avg_sentiment || 'N/A';
                document.getElementById('weeklyPositive').textContent = data.positive_count.toLocaleString();
                document.getElementById('weeklyNegative').textContent = data.negative_count.toLocaleString();

                const weeklyTopStocks = document.getElementById('weeklyTopStocks');
                if (data.top_stocks && data.top_stocks.length > 0) {
                    weeklyTopStocks.innerHTML = data.top_stocks.map((stock, i) =>
                        `<div style="padding: 8px 0; border-bottom: 1px solid #eee;">
                            ${i + 1}. <strong>${stock.stock_name}</strong> - ${stock.news_count} 則新聞
                        </div>`
                    ).join('');
                } else {
                    weeklyTopStocks.innerHTML = '<div style="padding: 8px 0;">暫無資料</div>';
                }
            } catch (e) {
                console.error("fetchWeeklyAnalysis error", e);
            }
        }

        async function fetchWeeklySentimentTrend() {
            try {
                const response = await fetch('/api/weekly_sentiment_trend');
                const data = await response.json();

                const ctx = document.getElementById('weeklySentimentChart').getContext('2d');

                if (weeklySentimentChart) weeklySentimentChart.destroy();

                weeklySentimentChart = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: '平均情緒分數',
                            data: data.data,
                            backgroundColor: 'rgba(245, 158, 11, 0.2)',
                            borderColor: 'rgba(245, 158, 11, 1)',
                            borderWidth: 3,
                            fill: true,
                            tension: 0.4,
                            pointRadius: 5,
                            pointBackgroundColor: 'rgba(245, 158, 11, 1)'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                min: 0,
                                max: 9,
                                ticks: {
                                    stepSize: 1
                                }
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("fetchWeeklySentimentTrend error", e);
            }
        }

        async function fetchRecentNews() {
            try {
                const response = await fetch('/api/recent_news');
                const data = await response.json();

                const newsList = document.getElementById('newsList');

                if (data.length === 0) {
                    newsList.innerHTML = '<div class="loading">暫無新聞</div>';
                    return;
                }

                newsList.innerHTML = data.map(news => {
                    let sentimentClass = 'sentiment-neutral';
                    if (news.sentiment_score >= 7) sentimentClass = 'sentiment-positive';
                    else if (news.sentiment_score <= 3) sentimentClass = 'sentiment-negative';

                    return `
                        <div class="news-item">
                            <div class="news-header">
                                <span class="stock-badge">${news.stock_name}</span>
                                ${news.sentiment_score ? `<span class="sentiment-badge ${sentimentClass}">${news.sentiment_score}</span>` : ''}
                            </div>
                            <div class="news-title">
                                <a href="${news.url}" target="_blank" style="color: #333; text-decoration: none;">
                                    ${news.title}
                                </a>
                            </div>
                            <div class="news-meta">
                                <span style="background: #e3e3e3; padding: 2px 8px; border-radius: 10px; margin-right: 8px; font-size: 0.8em;">${news.source}</span>
                                ${news.publisher || '未知來源'} | ${news.published_text || '未知時間'}
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("fetchRecentNews error", e);
            }
        }

        async function fetchIndicators() {
            const keys = ['market_sentiment', 'topic_heat', 'news_momentum'];
            try {
                const response = await fetch('/api/indicators');
                const data = await response.json();

                keys.forEach(key => {
                    const card = document.getElementById(`indicator-${key}`);
                    const info = data ? data[key] : null;
                    const scoreEl = card.querySelector('.indicator-score');
                    const fillEl = card.querySelector('.meter-fill');
                    const statusEl = card.querySelector('.indicator-status');

                    if (!info || info.score === null || info.score === undefined) {
                        scoreEl.innerHTML = '- <span class="max">/ 10</span>';
                        fillEl.style.width = '0%';
                        fillEl.className = 'meter-fill';
                        statusEl.textContent = '尚無資料';
                        statusEl.className = 'indicator-status';
                        return;
                    }

                    const score = info.score;
                    let band = 'neutral';
                    if (score >= 7) band = 'good';
                    else if (score < 4) band = 'bad';

                    scoreEl.innerHTML = `${score.toFixed(1)} <span class="max">/ 10</span>`;
                    fillEl.style.width = `${Math.min(score / 10 * 100, 100)}%`;
                    fillEl.className = `meter-fill fill-${band}`;
                    statusEl.textContent = info.label || '';
                    statusEl.className = `indicator-status status-${band}`;
                });
            } catch (e) {
                console.error("fetchIndicators error", e);
            }
        }

        async function fetchHotTopics() {
            try {
                const response = await fetch('/api/hot_topics');
                const data = await response.json();

                const grid = document.getElementById('topicGrid');

                if (!data || data.length === 0) {
                    grid.innerHTML = '<div class="loading">尚無資料</div>';
                    return;
                }

                grid.innerHTML = data.map(topic => {
                    let sentimentColor = '#f59e0b';
                    if (topic.avg_sentiment >= 7) sentimentColor = '#10b981';
                    else if (topic.avg_sentiment <= 3) sentimentColor = '#ef4444';

                    return `
                        <div class="topic-card">
                            <div><span class="topic-rank">${topic.rank}</span><span class="topic-keyword">${topic.keyword}</span></div>
                            <div class="topic-category">${topic.category || ''}</div>
                            <div class="topic-meta">
                                <span>近期 ${topic.recent_count} 則</span>
                                <span>趨勢 ${topic.trend_ratio != null ? (topic.trend_ratio >= 30 ? '30x+' : topic.trend_ratio.toFixed(1) + 'x') : '-'}</span>
                                <span style="color:${sentimentColor}; font-weight:bold;">情緒 ${topic.avg_sentiment != null ? topic.avg_sentiment.toFixed(1) : '-'}</span>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (e) {
                console.error("fetchHotTopics error", e);
            }
        }

        async function refreshAll() {
            updateTime();
            await Promise.all([
                fetchStats(),
                fetchIndicators(),
                fetchHotTopics(),
                fetchSentimentDistribution(),
                fetchTopStocks(),
                fetchDailyTrend(),
                fetchRecentNews(),
                fetchWeeklyAnalysis(),
                fetchWeeklySentimentTrend()
            ]);
        }

        // 初始載入
        refreshAll();

        // 每30秒自動更新
        setInterval(refreshAll, 30000);
    </script>
</body>

</html>
